<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>calc.js regression tests</title>
</head>
<body>
  <h1>calc.js regression tests</h1>
  <p>Open the browser console to see results. All assertions log to console; failures throw.</p>
  <script src="js/calc.js"></script>
  <script src="js/usno.js"></script>
  <script>
    var pass = 0, fail = 0;

    function assertClose(label, actual, expected, tolerance) {
      tolerance = tolerance === undefined ? 0.05 : tolerance;
      var ok = Math.abs(actual - expected) <= tolerance;
      if (ok) {
        pass++;
        console.log('PASS: ' + label + ' (got ' + actual.toFixed(4) + ', expected ~' + expected + ')');
      } else {
        fail++;
        console.error('FAIL: ' + label + ' -- got ' + actual + ', expected ~' + expected + ' (tolerance ' + tolerance + ')');
      }
    }

    // --- Worked example: Sun sight (values adapted from a standard sight-reduction
    // teaching example; DR/AP near 35N 015W, LHA computed to land near a whole degree). ---
    // AP: Lat 35 15.0 N, Lon 015 33.0 W
    // GHA base 100 00.0, GHA next 115 02.5 (i.e. Sun moves ~15.04 deg/hr)
    // Dec base 15 00.0 N, Dec next 15 01.2 N (roughly steady)
    // UTC fraction of hour = 0.60 (36 minutes into the hour)
    (function testSunReduction() {
      var lat = SightCalc.dmToDecimal(35, 15.0);
      var lon = SightCalc.dmToDecimal(15, 33.0);
      var fraction = 0.60;

      var nonStar = {
        ghaBase: SightCalc.dmToDecimal(100, 0.0),
        ghaNext: SightCalc.dmToDecimal(115, 2.5),
        decBase: SightCalc.dmToDecimal(15, 0.0),
        decNext: SightCalc.dmToDecimal(15, 1.2)
      };

      var ho = SightCalc.dmToDecimal(31, 20.0); // arbitrary plausible Ho for the test

      var result = SightCalc.reduceSight({
        bodyType: 'sun',
        lat: lat,
        lon: lon,
        lonEW: 'W',
        utcFractionOfHour: fraction,
        nonStar: nonStar,
        ho: ho
      });

      // Interpolated GHA should land between base and next, roughly base + 0.6*(next-base)
      var expectedGha = 100.0 + 0.60 * (115 + 2.5 / 60 - 100.0);
      assertClose('Interpolated GHA', result.interpolatedGha, expectedGha, 0.01);

      // LHA = GHA - lon (W)
      var expectedLha = ((expectedGha - lon) % 360 + 360) % 360;
      assertClose('LHA', result.lha, expectedLha, 0.01);

      // Hc should be a plausible altitude (sanity bound, not a precise external reference)
      if (result.hc > -90 && result.hc < 90) {
        pass++;
        console.log('PASS: Hc within valid range (' + result.hc.toFixed(2) + ')');
      } else {
        fail++;
        console.error('FAIL: Hc out of range: ' + result.hc);
      }

      // Zn should be a valid compass bearing
      if (result.zn >= 0 && result.zn <= 360) {
        pass++;
        console.log('PASS: Zn within valid range (' + result.zn.toFixed(1) + ')');
      } else {
        fail++;
        console.error('FAIL: Zn out of range: ' + result.zn);
      }
    })();

    // --- Sanity check: known right-angle case ---
    // Observer at the equator (lat 0), body's GP also on the equator (dec 0),
    // LHA = 90 (body due east/west on the horizon-ish). Hc should be 0.
    (function testEquatorRightAngle() {
      var result = SightCalc.reduceSight({
        bodyType: 'sun',
        lat: 0,
        lon: 0,
        lonEW: 'W',
        utcFractionOfHour: 0,
        nonStar: { ghaBase: 90, ghaNext: 90, decBase: 0, decNext: 0 },
        ho: 0
      });
      assertClose('Hc at lat=0, dec=0, LHA=90 should be ~0', result.hc, 0, 0.1);
    })();

    // --- GHA rollover across the hour boundary ---
    (function testGhaRollover() {
      var interp = SightCalc.interpolateGha(355, 10, 0.5); // next hour wraps past 360
      assertClose('GHA rollover interpolation', interp, 2.5, 0.01);
    })();

    // --- Ho correction sign handling ---
    (function testHoCorrections() {
      var ho = SightCalc.computeHo(31.5, {
        ieMin: 2.0, ieSign: 'on',       // -2.0'
        dipMin: 3.8,                     // always -3.8'
        altCorrMin: 12.4, altCorrSign: '-', // -12.4'
        addAltCorrMin: 0.2, addAltCorrSign: '+' // +0.2'
      });
      var expectedCorrDeg = (-2.0 - 3.8 - 12.4 + 0.2) / 60;
      assertClose('Ho with mixed corrections', ho, 31.5 + expectedCorrDeg, 0.0001);
    })();

    // --- secondsToTimeString must carry seconds->minutes->hours on rounding ---
    (function testTimeStringCarry() {
      // 59.6s should round to 60, which must carry into the minute (not display ":60")
      var t1 = SightCalc.secondsToTimeString(59.6);
      if (t1 === '00:01:00') { pass++; console.log('PASS: seconds carry into minute (' + t1 + ')'); }
      else { fail++; console.error('FAIL: expected 00:01:00, got ' + t1); }

      // 3599.6s (59:59.6) should carry all the way into the hour
      var t2 = SightCalc.secondsToTimeString(3599.6);
      if (t2 === '01:00:00') { pass++; console.log('PASS: minutes carry into hour (' + t2 + ')'); }
      else { fail++; console.error('FAIL: expected 01:00:00, got ' + t2); }

      // Sanity: ordinary value with no carry
      var t3 = SightCalc.secondsToTimeString(3723.2); // 1:02:03.2
      if (t3 === '01:02:03') { pass++; console.log('PASS: ordinary rounding (' + t3 + ')'); }
      else { fail++; console.error('FAIL: expected 01:02:03, got ' + t3); }
    })();

    // --- computeHa: Hs corrected for IE and Dip only (no refraction yet) ---
    (function testComputeHa() {
      var ha = SightCalc.computeHa(31.5, {
        ieMin: 2.0, ieSign: 'on',  // -2.0'
        dipMin: 3.8                 // always -3.8'
      });
      assertClose('Ha (IE + Dip only)', ha, 31.5 + (-2.0 - 3.8) / 60, 0.0001);
    })();

    // --- LOP geometry: due-north azimuth, positive (TOWARD) intercept ---
    (function testLopGeometryNorth() {
      var geo = SightCalc.computeLopGeometry(0, 10); // body due north, 10nm toward
      assertClose('Intercept point x (due N, TOWARD)', geo.interceptPoint.x, 0, 0.001);
      assertClose('Intercept point y (due N, TOWARD)', geo.interceptPoint.y, 10, 0.001);
      // LOP should run due East-West (perpendicular to a North azimuth)
      assertClose('LOP direction x (perp to N)', Math.abs(geo.lopDirection.x), 1, 0.001);
      assertClose('LOP direction y (perp to N)', Math.abs(geo.lopDirection.y), 0, 0.001);
    })();

    // --- LOP geometry: due-east azimuth, negative (AWAY) intercept ---
    (function testLopGeometryEastAway() {
      var geo = SightCalc.computeLopGeometry(90, -5); // body due east, 5nm away -> point is due west
      assertClose('Intercept point x (due E, AWAY)', geo.interceptPoint.x, -5, 0.001);
      assertClose('Intercept point y (due E, AWAY)', geo.interceptPoint.y, 0, 0.001);
    })();

    // --- chooseNiceScale always covers the requested extent ---
    (function testChooseNiceScale() {
      [0, 1.2, 4.9, 17, 123, 4321].forEach(function (v) {
        var scale = SightCalc.chooseNiceScale(v);
        if (scale >= Math.abs(v)) { pass++; console.log('PASS: scale ' + scale + ' covers extent ' + v); }
        else { fail++; console.error('FAIL: scale ' + scale + ' does NOT cover extent ' + v); }
      });
    })();

    // --- decimalToDM: basic and rounding-carry cases ---
    (function testDecimalToDM() {
      var a = SightCalc.decimalToDM(115.041667);
      assertClose('decimalToDM deg', a.deg, 115, 0.001);
      assertClose('decimalToDM min', a.min, 2.5, 0.05);

      var b = SightCalc.decimalToDM(14.99999);
      if (b.deg === 15 && b.min === 0) { pass++; console.log('PASS: decimalToDM carries to next degree, not 60.0min'); }
      else { fail++; console.error('FAIL: decimalToDM carry, got deg=' + b.deg + ' min=' + b.min); }
    })();

    // --- USNO assembleFill: pure parsing/matching against mock payloads ---
    (function testUsnoAssembleFill() {
      function mkData(entries) {
        return entries.map(function (e) {
          return {
            object: e.name, nav_star_number: e.num || null,
            almanac_data: { dec: e.dec, gha: e.gha, hc: 0, zn: 0 },
            altitude_corrections: { isCorrected: true, pa: 0, refr: 0, sd: 0, sum: 0 }
          };
        });
      }

      var baseStar = mkData([{ name: 'Aries', dec: 0, gha: 50.0 }, { name: 'Aldebaran', num: 10, dec: 16.5, gha: 190.0 }]);
      var nextStar = mkData([{ name: 'Aries', dec: 0, gha: 65.0 }, { name: 'Aldebaran', num: 10, dec: 16.5, gha: 205.0 }]);
      var fillStar = SightUsno.assembleFill({ type: 'star', name: 'Aldebaran' }, baseStar, nextStar);
      assertClose('USNO star SHA', fillStar.shaDeg, 140.0, 0.001);

      var baseNoAries = mkData([{ name: 'Vega', dec: 38.8, gha: 300.0 }]);
      var nextNoAries = mkData([{ name: 'Vega', dec: 38.8, gha: 315.0 }]);
      var fillFallback = SightUsno.assembleFill({ type: 'star', name: 'Vega' }, baseNoAries, nextNoAries);
      if (fillFallback.shaDeg === 0 && fillFallback.ghaAriesBaseDeg === 300.0) {
        pass++; console.log('PASS: USNO star fallback (no Aries entry) produces SHA=0');
      } else {
        fail++; console.error('FAIL: USNO star fallback incorrect: ' + JSON.stringify(fillFallback));
      }

      var basePlanet = mkData([{ name: 'Jupiter', dec: 22.1, gha: 44.5 }]);
      var nextPlanet = mkData([{ name: 'Jupiter', dec: 22.1, gha: 59.5 }]);
      var fillPlanet = SightUsno.assembleFill({ type: 'planet', name: 'Jupiter' }, basePlanet, nextPlanet);
      assertClose('USNO planet GHA base', fillPlanet.ghaBaseDeg, 44.5, 0.001);

      var threw = false;
      try { SightUsno.assembleFill({ type: 'star', name: 'Nonexistentia' }, baseStar, nextStar); }
      catch (e) { threw = true; }
      if (threw) { pass++; console.log('PASS: USNO missing-body throws a descriptive error'); }
      else { fail++; console.error('FAIL: USNO missing-body should have thrown'); }
    })();

    console.log('--- ' + pass + ' passed, ' + fail + ' failed ---');
    if (fail > 0) {
      throw new Error(fail + ' calc.js regression test(s) failed. See console above.');
    }
  </script>
</body>
</html>

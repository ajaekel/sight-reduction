<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Sightings - Offline Sight Reduction</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
  <div class="header-row">
    <h1 style="margin-bottom: 2px;">Sightings</h1>
    <div class="header-controls">
      <div id="swVersion" style="font-size: 0.75rem; color: var(--accent, #888); font-family: monospace;">
        Version: loading...
      </div>
      <div class="header-buttons">
        <div class="nav-menu-wrap">
          <button class="btn-hamburger" id="btnNavMenu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" type="button">
            <span></span><span></span><span></span>
          </button>
          <div class="nav-menu" id="navMenu">
            <div class="nav-menu-header">Sightings</div>
            <a href="sightings.html" class="nav-menu-item nav-menu-sub">Sightings</a>
            <a href="index.html" class="nav-menu-item">New sighting</a>
            <a href="fixes.html" class="nav-menu-item">Fixes</a>
            <a href="planning.html" class="nav-menu-item">Planning</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="cache-blurb">
    Sightings you've saved on this device. Load one to continue editing it on the New Sighting
    page, or delete it for good.
  </p>

  <div class="card">
    <div class="section-title">Saved Sightings (this device)</div>
    <div class="saved-list" id="savedList"></div>
    <div class="empty-note" id="savedListEmpty">No sightings saved on this device yet.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/nav.js"></script>
<script src="js/version.js"></script>
<script src="js/sightings.js"></script>
</body>
</html>

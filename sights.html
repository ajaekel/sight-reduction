<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Sights - Offline Sight Reduction</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
  <div class="header-row">
    <h1 style="margin-bottom: 2px;">Sights</h1>
    <div class="header-controls">
      <div id="swVersion" style="font-size: 0.75rem; color: var(--accent, #888); font-family: monospace;">
        Version: loading...
      </div>
      <div class="header-buttons">
        <div class="nav-menu-wrap">
          <button class="btn-hamburger" id="btnNavMenu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" type="button">
            <span></span><span></span><span></span>
          </button>
          <div class="nav-menu" id="navMenu">
            <div class="nav-menu-header">Sights</div>
            <a href="index.html" class="nav-menu-item nav-menu-sub">New Sight</a>
            <a href="sights.html" class="nav-menu-item nav-menu-sub">Sights</a>
            <a href="fixes.html" class="nav-menu-item">Fixes</a>
            <a href="planning.html" class="nav-menu-item">Planning</a>
            <a href="drleg.html" class="nav-menu-item">DR Leg</a>
            <a href="passages.html" class="nav-menu-item">Passages</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="cache-blurb">
    Sights you've saved on this device. Load one to continue editing it on the New Sight
    page, or delete it for good.
  </p>

  <div class="save-export-row">
    <button class="btn-secondary" id="btnImport">Import</button>
  </div>
  <input type="file" id="fileImportJson" accept="application/json,.json" style="display: none;">

  <div class="card">
    <div class="section-title">Saved Sights (this device)</div>
    <div class="saved-list" id="savedList"></div>
    <div class="empty-note" id="savedListEmpty">No sights saved on this device yet.</div>
  </div>

  <!-- ADD TO FIX -->
  <div class="card" id="addToFixPanel" style="display: none;">
    <div class="section-title">Add to a Fix</div>
    <div class="form-group">
      <label>Fix</label>
      <select id="addToFixSelect">
        <option value="__new__">+ Create a new fix</option>
      </select>
    </div>
    <div class="form-group" id="newFixNameGroup">
      <label>New fix name</label>
      <input type="text" id="newFixNameInput" placeholder="e.g. Morning stars">
    </div>
    <div class="save-export-row">
      <button class="btn-secondary" id="btnConfirmAddToFix">Add</button>
      <button class="btn-secondary" id="btnCancelAddToFix">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/calc.js"></script>
<script src="js/storage.js"></script>
<script src="js/fixStorage.js"></script>
<script src="js/nav.js"></script>
<script src="js/version.js"></script>
<script src="js/sights.js"></script>
</body>
</html>
